<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>

<nav class="navbar">
  <div class="brand"><div class="brand-mark">A</div>ATLAS <span>MC</span></div>
  <ul class="nav-links">

    <li><a href="kits.html">Kits</a></li>

  </ul>
  <button class="cart-btn">

    <span class="count" data-cart-count>0</span>

<main class="cart-page">

  <div class="cart-panel" id="cart-items"></div>

  <div class="cart-summary" id="cart-summary">
    <div class="cart-summary-row">
      <span class="cart-summary-label">Total a pagar</span>
      <span class="cart-summary-total" id="cart-total">R$ 0,00</span>
    </div>
    <button class="btn btn-primary btn-block" onclick="finalizar()">
      Finalizar Compra
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M5 12h14M13 6l6 6-6 6"/>
      </svg>

  </div>

</main>

<footer class="footer">
