<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gbzin Shop</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
  <header id="header" class="header"></header>
  <main id="app" class="app" aria-live="polite"></main>
  
  <footer class="footer">
    <div class="footer-inner"><div><strong>Gbzin Shop</strong><p>Uma experiência digital simples e segura.</p></div><div class="footer-links"><button onclick="window.navigate('about')">Sobre</button><button onclick="window.navigate('faq')">Perguntas frequentes</button><button onclick="window.navigate('contact')">Contato</button><button onclick="window.navigate('shipping')">Entrega</button><button onclick="window.navigate('privacy')">Privacidade</button><button onclick="window.navigate('terms')">Termos</button></div><p class="copyright">&copy; <span id="year"></span> Gbzin Shop — Todos os direitos reservados.</p></div>
  </footer>

  <script>
    // Mostra uma mensagem útil caso o módulo principal não consiga iniciar.
    window.addEventListener('error', function (event) {
      console.error('[Gbzin Shop]', event.error || event.message);
    });
    window.addEventListener('unhandledrejection', function (event) {
      console.error('[Gbzin Shop] Falha assíncrona:', event.reason);
    });
  </script>
  <script type="module" src="src/js/main.js"></script>
</body>
</html>
